<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MovilCash Docs</title>
    <!-- GitHub Pages serves this for any unknown path (deep links on refresh).
         It encodes the requested path into a query string, redirects to the
         SPA root, and index.html restores it via sessionStorage.
         See: https://github.com/rafgraph/spa-github-pages -->
    <script>
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
  </head>
  <body></body>
</html>
